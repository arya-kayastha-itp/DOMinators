AWSTemplateFormatVersion: "2010-09-09"
Description: >
  3 deliberately-insecure legacy EC2 apps in Account A:
  app-catalog, app-pricing (depends on catalog), app-orders (depends on pricing).
  Each triggers: SG_OPEN_SSH, SG_OPEN_APP, EBS_UNENCRYPTED, IMDSV1, OLD_AMI, PUBLIC_IP.
  app-pricing and app-orders also trigger MISSING_TAGS.

Parameters:
  EnvName:
    Type: String
    Default: mig-legacy
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair (legacy SSH access is intentionally left on)
  OldAmiId:
    Type: AWS::EC2::Image::Id
    Description: >
      A pinned, OUT-OF-DATE Amazon Linux 2 AMI ID for this region
      (look one up manually — do NOT use the SSM "latest" parameter,
      that's reserved for the golden module in Account B).
  InstanceType:
    Type: String
    Default: t3.micro
  TargetVpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: Account B CIDR, allowed into the app port over peering

Resources:
  # ---------- Security groups ----------

  CatalogSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: app-catalog SG - deliberately open
      VpcId: !ImportValue
        Fn::Sub: "${EnvName}-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref TargetVpcCidr
      Tags:
        - Key: Name
          Value: app-catalog-sg

  PricingSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: app-pricing SG - deliberately open
      VpcId: !ImportValue
        Fn::Sub: "${EnvName}-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref TargetVpcCidr
      Tags:
        - Key: Name
          Value: app-pricing-sg

  OrdersSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: app-orders SG - deliberately open
      VpcId: !ImportValue
        Fn::Sub: "${EnvName}-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref TargetVpcCidr
      Tags:
        - Key: Name
          Value: app-orders-sg

  # SG-reference dependency signal: pricing allows orders' SG, catalog allows pricing's SG
  PricingIngressFromOrders:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref PricingSG
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref OrdersSG

  CatalogIngressFromPricing:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CatalogSG
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref PricingSG

  # ---------- app-catalog (no dependency) ----------

  CatalogInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref OldAmiId
      KeyName: !Ref KeyName
      SubnetId: !ImportValue
        Fn::Sub: "${EnvName}-public-subnet-a"
      SecurityGroupIds: [!Ref CatalogSG]
      MetadataOptions:
        HttpTokens: optional   # IMDSV1
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            Encrypted: false   # EBS_UNENCRYPTED
      Tags:
        - Key: Name
          Value: app-catalog
        - Key: owner
          Value: team-x
        - Key: cost-center
          Value: cc-1
        - Key: data-class
          Value: internal
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cat <<'PYEOF' > /home/ec2-user/app.py
          import http.server, json, os, urllib.request
          APP_ID = "app-catalog"
          UPSTREAM_URL = ""
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path in ("/health", "/catalog/health"):
                      self.send_response(200); self.end_headers(); self.wfile.write(b"OK"); return
                  body = json.dumps({"app": APP_ID, "served_by": "legacy", "version": "1.0", "upstream": None})
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(body.encode())
          http.server.HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PYEOF
          cat <<'EOF' > /etc/systemd/system/app.service
          [Unit]
          Description=legacy app
          [Service]
          ExecStart=/usr/bin/python3 /home/ec2-user/app.py
          Restart=always
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl enable --now app

  # ---------- app-pricing (depends on catalog) ----------

  PricingInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref OldAmiId
      KeyName: !Ref KeyName
      SubnetId: !ImportValue
        Fn::Sub: "${EnvName}-public-subnet-a"
      SecurityGroupIds: [!Ref PricingSG]
      MetadataOptions:
        HttpTokens: optional
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            Encrypted: false
      Tags:
        - Key: Name
          Value: app-pricing
        - Key: depends-on
          Value: app-catalog
        # MISSING_TAGS: owner / cost-center / data-class deliberately omitted
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cat <<'PYEOF' > /home/ec2-user/app.py
          import http.server, json, os, urllib.request
          APP_ID = "app-pricing"
          UPSTREAM_URL = "http://${CatalogInstance.PrivateIp}:8080/"
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path in ("/health", "/pricing/health"):
                      self.send_response(200); self.end_headers(); self.wfile.write(b"OK"); return
                  upstream = None
                  try:
                      upstream = urllib.request.urlopen(UPSTREAM_URL, timeout=2).read().decode()
                  except Exception:
                      self.send_response(500); self.end_headers()
                      self.wfile.write(b'{"error":"upstream unavailable"}'); return
                  body = json.dumps({"app": APP_ID, "served_by": "legacy", "version": "1.0", "upstream": upstream})
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(body.encode())
          http.server.HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PYEOF
          cat <<'EOF' > /etc/systemd/system/app.service
          [Unit]
          Description=legacy app
          [Service]
          ExecStart=/usr/bin/python3 /home/ec2-user/app.py
          Restart=always
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl enable --now app

  # ---------- app-orders (depends on pricing) ----------

  OrdersInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref OldAmiId
      KeyName: !Ref KeyName
      SubnetId: !ImportValue
        Fn::Sub: "${EnvName}-public-subnet-a"
      SecurityGroupIds: [!Ref OrdersSG]
      MetadataOptions:
        HttpTokens: optional
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            Encrypted: false
      Tags:
        - Key: Name
          Value: app-orders
        - Key: depends-on
          Value: app-pricing
        # MISSING_TAGS deliberately omitted
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cat <<'PYEOF' > /home/ec2-user/app.py
          import http.server, json, os, urllib.request
          APP_ID = "app-orders"
          UPSTREAM_URL = "http://${PricingInstance.PrivateIp}:8080/"
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path in ("/health", "/orders/health"):
                      self.send_response(200); self.end_headers(); self.wfile.write(b"OK"); return
                  upstream = None
                  try:
                      upstream = urllib.request.urlopen(UPSTREAM_URL, timeout=2).read().decode()
                  except Exception:
                      self.send_response(500); self.end_headers()
                      self.wfile.write(b'{"error":"upstream unavailable"}'); return
                  body = json.dumps({"app": APP_ID, "served_by": "legacy", "version": "1.0", "upstream": upstream})
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(body.encode())
          http.server.HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PYEOF
          cat <<'EOF' > /etc/systemd/system/app.service
          [Unit]
          Description=legacy app
          [Service]
          ExecStart=/usr/bin/python3 /home/ec2-user/app.py
          Restart=always
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl enable --now app

  # ---------- app-juice-shop (real app, stateless -> Golden) ----------

  JuiceShopSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: app-juice-shop SG - deliberately open
      VpcId: !ImportValue
        Fn::Sub: "${EnvName}-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref TargetVpcCidr
      Tags:
        - Key: Name
          Value: app-juice-shop-sg

  JuiceShopInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref OldAmiId
      KeyName: !Ref KeyName
      SubnetId: !ImportValue
        Fn::Sub: "${EnvName}-public-subnet-a"
      SecurityGroupIds: [!Ref JuiceShopSG]
      MetadataOptions:
        HttpTokens: optional
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            Encrypted: false
      Tags:
        - Key: Name
          Value: app-juice-shop
        - Key: owner
          Value: team-x
        - Key: cost-center
          Value: cc-1
        - Key: data-class
          Value: internal
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf install -y docker
          systemctl enable --now docker
          docker run -d --name app-juice-shop --restart always -p 8080:3000 bkimminich/juice-shop:v20.2.0

  # ---------- app-gitea (real app, stateful -> Red, parked) ----------

  GiteaSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: app-gitea SG - deliberately open
      VpcId: !ImportValue
        Fn::Sub: "${EnvName}-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: app-gitea-sg

  GiteaInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref OldAmiId
      KeyName: !Ref KeyName
      SubnetId: !ImportValue
        Fn::Sub: "${EnvName}-public-subnet-a"
      SecurityGroupIds: [!Ref GiteaSG]
      MetadataOptions:
        HttpTokens: optional
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            Encrypted: false
      Tags:
        - Key: Name
          Value: app-gitea
        - Key: owner
          Value: team-x
        - Key: cost-center
          Value: cc-1
        - Key: data-class
          Value: internal
        - Key: stateful
          Value: "true"
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /opt/gitea
          docker run -d --name app-gitea --restart always -p 8080:3000 \
            -e GITEA__security__INSTALL_LOCK=true \
            -e GITEA__database__DB_TYPE=sqlite3 \
            -v /opt/gitea:/data gitea/gitea:1.27.3

  # ---------- SSM parameters: 2nd dependency signal ----------

  PricingUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /legacy/app-orders/PRICING_URL
      Type: String
      Value: !Sub "http://${PricingInstance.PrivateIp}:8080"

  CatalogUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /legacy/app-pricing/CATALOG_URL
      Type: String
      Value: !Sub "http://${CatalogInstance.PrivateIp}:8080"

Outputs:
  CatalogPublicIp:
    Value: !GetAtt CatalogInstance.PublicIp
  PricingPublicIp:
    Value: !GetAtt PricingInstance.PublicIp
  OrdersPublicIp:
    Value: !GetAtt OrdersInstance.PublicIp
  CatalogPrivateIp:
    Value: !GetAtt CatalogInstance.PrivateIp
  PricingPrivateIp:
    Value: !GetAtt PricingInstance.PrivateIp
  OrdersPrivateIp:
    Value: !GetAtt OrdersInstance.PrivateIp
  JuiceShopPrivateIp:
    Value: !GetAtt JuiceShopInstance.PrivateIp
  GiteaPrivateIp:
    Value: !GetAtt GiteaInstance.PrivateIp
