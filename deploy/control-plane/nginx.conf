# nginx for the DOMinators control plane (installed by scripts/deploy_control_plane.py
# on every deploy). CloudFront -> ALB :8088 -> this server on :80.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 80 default_server;
    root /opt/dominators/current/migration-accelerator-console/out;

    # Behind CloudFront the Host is the ALB's name, so absolute redirects
    # (/journey -> http://<alb>/journey/) would send visitors to the ALB
    # directly. Relative Location headers keep them on the CloudFront URL.
    absolute_redirect off;

    # Orchestrator. SSE (/api/events) needs buffering off and a long read timeout.
    location /api/ {
      proxy_pass http://127.0.0.1:8000/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    location / {
      try_files $uri $uri/ $uri.html /404.html;
    }
  }
}
